[package]
name = "samurai"
version = "0.1.0"
edition = "2021"
description = "Samurai: the white-frame desktop for Hyprland + Quickshell. Settings store, Hyprland config generator, keybinds, the one-time seal, incognito."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
