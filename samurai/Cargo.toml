[package]
name = "samurai"
version = "0.1.0"
edition = "2021"
description = "Samurai (X11): settings, config generation, the one-time ink, screenshots, updates."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
libc = "0.2"
